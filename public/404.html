<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Micheal Wolski</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      *{box-sizing:border-box;margin:0}
      body{background:#0a0e14;color:#e6edf3;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
        background-image:radial-gradient(rgba(120,137,154,0.05) 1px,transparent 1px);background-size:34px 34px}
      .wrap{max-width:460px}
      .code{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:88px;font-weight:800;letter-spacing:-2px;
        background:linear-gradient(120deg,#22d3ee,#2dd4bf);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
      h1{font-size:22px;font-weight:700;margin:6px 0 10px}
      p{color:#aab6c4;line-height:1.7;margin-bottom:26px}
      a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:14px;color:#04121a;
        background:linear-gradient(135deg,#22d3ee,#2dd4bf);padding:13px 26px;border-radius:11px}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has moved. Let's get you back on track.</p>
      <a href="/">← Back to home</a>
    </div>
  </body>
</html>
