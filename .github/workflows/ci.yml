name: CI

# Runs on pull requests as well as pushes, so problems surface before merge
# rather than after the deploy has already gone out.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Data-integrity tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium for the accessibility audit
        run: npx playwright install --with-deps chromium

      - name: Accessibility audit (axe-core, both themes)
        run: node scripts/a11y-check.mjs

      - name: Check internal links resolve
        run: node scripts/link-check.mjs
